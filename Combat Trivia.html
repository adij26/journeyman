<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journeyman: Combat Trivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0b0d; --panel:#16141a; --panel2:#1e1b22; --line:#2c2830;
  --bone:#f2ece0; --muted:#9a948a; --red:#d62839; --red2:#8f1422; --gold:#e8b84a;
  --t1:#9a968e; --t2:#4f86e8; --t3:#38b27a; --t4:#a46be0; --t5:#e8b84a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--bone);font-family:"Barlow",system-ui,sans-serif;min-height:100%}
body{background:
  radial-gradient(1200px 500px at 50% -200px,rgba(214,40,57,.18),transparent 70%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 6px),var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:"Anton",Impact,sans-serif;font-size:26px;letter-spacing:.06em;line-height:1}
.brand small{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:12px;letter-spacing:.32em;color:var(--red);margin-top:4px}
.daytag{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;letter-spacing:.14em;font-size:13px;color:var(--muted);text-align:right;text-transform:uppercase}
.daytag b{color:var(--bone);font-size:16px;display:block}
h1{font-family:"Anton",Impact,sans-serif;font-size:clamp(44px,11vw,76px);line-height:.92;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:var(--red)}
.lede{font-size:18px;color:#d9d2c4;margin:16px 0 22px;line-height:1.45;max-width:34em}
.lede b{color:var(--bone)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.label{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.ladder{display:grid;gap:6px;margin-top:10px}
.rung{display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;letter-spacing:.04em}
.rung .bar{height:8px;border-radius:2px}
.rung .pts{margin-left:auto;color:var(--muted);font-size:16px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.rule b{font-family:"Anton",Impact,sans-serif;font-size:28px;display:block;letter-spacing:.02em}
.rule span{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:6px;background:var(--red);color:#fff;font-family:"Anton",Impact,sans-serif;font-size:24px;letter-spacing:.08em;text-transform:uppercase;padding:16px;cursor:pointer;box-shadow:0 4px 0 var(--red2);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;font-size:18px;color:var(--bone)}
.btn:disabled{opacity:.5;cursor:default}
.foot{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.5}
/* round */
.rhead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.rnum{font-family:"Anton",Impact,sans-serif;font-size:40px;line-height:1;text-transform:uppercase}
.rnum span{color:var(--muted);font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.14em;font-size:12px;text-transform:uppercase;padding:5px 9px;border-radius:3px;border:1px solid var(--line);background:var(--panel2)}
.chip.h{border-color:var(--red);color:#ff8a96}
.timer{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;margin:4px 0 6px;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff5a5f);transform-origin:left;width:100%}
.secs{font-family:"Anton",Impact,sans-serif;font-size:20px;text-align:right;color:var(--muted)}
.secs.low{color:var(--red)}
.prompt{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(26px,6.4vw,36px);line-height:1.12;margin:16px 0 20px}
.inrow{display:flex;gap:8px}
input.ans{flex:1;min-width:0;background:#0f0e11;border:2px solid var(--line);border-radius:6px;color:var(--bone);font-size:20px;font-family:"Barlow";padding:14px;outline:none}
input.ans:focus{border-color:var(--bone)}
.go{width:auto;padding:0 20px;font-size:20px}
.msg{min-height:26px;margin-top:10px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;letter-spacing:.03em;color:#ff8a96}
.shake{animation:sh .3s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pips{display:flex;gap:5px;margin-bottom:18px}
.pip{flex:1;height:5px;border-radius:2px;background:var(--panel2)}
/* reveal */
.verdict{text-align:center;padding:26px 16px 22px;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.verdict .ans{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:30px;line-height:1.1}
.verdict .tier{font-family:"Anton",Impact,sans-serif;font-size:clamp(34px,9vw,52px);text-transform:uppercase;line-height:1;margin:12px 0 6px;letter-spacing:.02em}
.verdict .pts{font-family:"Anton",Impact,sans-serif;font-size:22px;color:var(--muted)}
.verdict .crowd{margin-top:8px;font-size:15px;color:var(--muted)}
.deep{margin-top:14px}
.deep ul{list-style:none;margin-top:8px;display:grid;gap:6px}
.deep li{display:flex;justify-content:space-between;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px;font-size:16px}
.deep li span{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.1em;font-size:12px;text-transform:uppercase;white-space:nowrap}
.spacer{height:16px}
/* impact meter */
.said{text-align:center;margin-bottom:14px}
.said .ans{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:32px;line-height:1.1;margin-top:4px}
.fix{margin-top:6px;font-size:14px;color:var(--muted)}
.fix b{color:var(--bone)}
.meter{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 12px 14px}
.mhead{display:flex;justify-content:space-between;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:10px}
.mhead #mstat{letter-spacing:.08em;font-size:14px}
.track{position:relative;height:300px;border-radius:4px;overflow:hidden;background:#0f0e11}
.band{position:relative;height:20%;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 14px 0 64px;border-top:2px solid rgba(242,236,224,.10);transition:background .25s}
.band:first-child{border-top:0}
.band::before{content:"";position:absolute;left:0;right:0;top:-2px;height:2px;background:linear-gradient(90deg,#d62839 0 33%,#f2ece0 33% 66%,#2c5cc5 66%);opacity:.35}
.band:first-child::before{display:none}
.band span{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:#5d5862;transition:color .2s}
.band em{font-style:normal;font-family:"Anton",Impact,sans-serif;font-size:14px;color:#4a4650;width:30px;text-align:right}
.band.lit span{color:#c9c2b6}
.band.hit{background:color-mix(in srgb,var(--c) 22%,transparent)}
.band.hit span,.band.hit em{color:var(--c)}
.trail{position:absolute;left:22px;top:0;width:8px;height:0;border-radius:0 0 4px 4px;background:linear-gradient(180deg,rgba(214,40,57,.15),var(--red))}
.glove{position:absolute;left:8px;top:0;font-size:34px;line-height:1;transform:translateY(-50%) rotate(-90deg);filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.track.thud{animation:thud .35s}
@keyframes thud{0%{transform:translateY(0)}30%{transform:translateY(5px)}60%{transform:translateY(-2px)}100%{transform:none}}
.after{display:none;margin-top:14px}
.after.on{display:block;animation:fadeup .3s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* results */
.score{text-align:center;padding:10px 0 6px}
.score .big{font-family:"Anton",Impact,sans-serif;font-size:clamp(70px,20vw,120px);line-height:.9}
.score .big small{font-size:.32em;color:var(--muted)}
.score .rank{font-family:"Anton",Impact,sans-serif;font-size:28px;text-transform:uppercase;color:var(--red);letter-spacing:.04em;margin-top:6px}
.cardline{display:grid;gap:2px;margin:18px 0}
.bout{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;background:var(--panel);border-left:4px solid var(--line)}
.bout:first-child{border-radius:4px 4px 0 0}.bout:last-child{border-radius:0 0 4px 4px}
.bout .n{font-family:"Anton",Impact,sans-serif;color:var(--muted)}
.bout .q{font-size:13px;color:var(--muted);line-height:1.3}
.bout .a{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:19px}
.bout .t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;text-align:right}
.bout .t b{display:block;font-family:"Anton",Impact,sans-serif;font-size:18px;letter-spacing:0}
.board{margin-top:18px}
.board ol{list-style:none;margin-top:8px;display:grid;gap:4px}
.board li{display:flex;justify-content:space-between;padding:8px 12px;background:var(--panel);border-radius:4px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px}
.board li.me{outline:1px solid var(--red)}
.next{text-align:center;margin-top:20px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.next b{display:block;font-family:"Anton",Impact,sans-serif;font-size:34px;color:var(--bone);letter-spacing:.04em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bone);color:#111;font-weight:600;padding:10px 16px;border-radius:4px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal .card{max-width:520px;width:100%;max-height:85vh;overflow:auto}
.modal h3{font-family:"Anton",Impact,sans-serif;font-size:26px;text-transform:uppercase;margin-bottom:10px}
.modal p{color:#d9d2c4;line-height:1.5;margin-bottom:10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}
</style>
</head>

/* ===================== HELPERS ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/ł/g,"l").replace(/[’'`.]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
const key = s => norm(s).replace(/^the /,"").replace(/ /g,"");
const SUFFIX = new Set(["jr","sr","ii","iii"]);
function surname(n){const w=norm(n).split(" ").filter(x=>!SUFFIX.has(x));return w.length>1?w[w.length-1]:null}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function parse(q){
  if(q._ans) return q._ans;
  const seen=new Set();
  q._ans = q.a.split(";").map(s=>s.trim()).filter(Boolean).map(s=>{
    const t=+s[0]; const names=s.slice(2).split("|").map(x=>x.trim());
    return {t, name:names[0], keys:names.map(key), sur:surname(names[0])};
  }).filter(x=>{const k=x.keys[0]; if(seen.has(k))return false; seen.add(k); return true});
  return q._ans;
}
function match(q,input){
  const ans=parse(q), k=key(input);
  if(k.length<2) return {type:"none"};
  let hit=ans.filter(a=>a.keys.includes(k));
  if(hit.length===1) return {type:"ok",a:hit[0],exact:true};
  const surs=ans.filter(a=>a.sur&&a.sur.replace(/ /g,"")===k);
  if(k.length>=3&&surs.length===1) return {type:"ok",a:surs[0],exact:true};
  if(surs.length>1) return {type:"amb"};
  if(k.length>=5){const ends=ans.filter(a=>a.keys[0].endsWith(k)&&a.keys[0]!==k);if(ends.length===1)return {type:"ok",a:ends[0],exact:true};if(ends.length>1)return {type:"amb"}}
  // Fuzzy: forgive misspellings, scaled to length. Doubled letters and
  // common sound-alikes (ph/f, ck/k, ee/i, y/i, z/s) are squashed first.
  const tol=k.length<=3?0:k.length<=5?1:k.length<=8?2:3;
  if(tol){const sk=squash(k);let best=99,cands=[];
    for(const a of ans){const targets=a.keys.slice();if(a.sur&&k.length>=4)targets.push(a.sur.replace(/ /g,""));
      const d=Math.min(...targets.map(x=>Math.min(lev(k,x),lev(sk,squash(x))+.5)));
      if(d<best-.001){best=d;cands=[a]}else if(Math.abs(d-best)<.001)cands.push(a)}
    if(best<=tol){if(cands.length===1)return {type:"ok",a:cands[0],exact:false};return {type:"amb"}}}
  return {type:"none"};
}
function squash(x){return x.replace(/ph/g,"f").replace(/ck/g,"k").replace(/ee|ea|ie/g,"i").replace(/y/g,"i").replace(/z/g,"s").replace(/(.)\1+/g,"$1")}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function etDate(d=new Date()){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(d)}
function dayIndex(ds){const [y,m,d]=ds.split("-").map(Number);return Math.round((Date.UTC(y,m-1,d)-EPOCH)/864e5)}
function secsToMidnightET(){const p=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour12:false,hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));return 86400-((+p.hour%24)*3600+(+p.minute)*60+(+p.second))}
function rankFor(s){let r=RANKS[0][1];for(const [m,n] of RANKS)if(s>=m)r=n;return r}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),1800)}
const pick=(arr,i)=>arr[((i%arr.length)+arr.length)%arr.length];

/* ===================== TODAY'S CARD ===================== */
const TODAY = etDate();
const DAY = Math.max(0, dayIndex(TODAY));
function buildCard(day){
  const r=rng(day*9973+17); const order=SLOT_ORDER.slice();
  for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  return order.map(slot=>{
    if(slot==="women"){const ufc=day%2===0;const q=pick(ufc?BANK.women_ufc:BANK.women_box,Math.floor(day/2));return {...q,slot,label:"Women's · "+(ufc?"UFC":"Boxing")}}
    const q=pick(BANK[slot],day); return {...q,slot,label:SLOTS[slot].label};
  });
}
const CARD = buildCard(DAY);

/* ===================== STATE ===================== */
const LS="journeyman_v1";
let state = load() || {date:TODAY,i:0,res:[],started:false,done:false};
if(state.date!==TODAY) state={date:TODAY,i:0,res:[],started:false,done:false};
function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} queueRemote()}
const total=()=>state.res.reduce((s,r)=>s+(r.pts||0),0);

/* ===================== SHARED DATA (crowd rarity + leaderboard) ===================== */
let DB=null, USER=null, UID=null, CROWD={}, OTHERS=[], remoteBusy=Promise.resolve();
async function initShared(){
  try{
    if(!window.claude||!window.claude.use) return;
    [DB,USER]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!DB||!USER) {DB=null;return}
    UID=await USER.id(); if(!UID){DB=null;return}
    const snap=await withTimeout(DB.collection("plays").get(),10000);
    OTHERS=[]; CROWD={};
    for(const d of snap.docs){
      const day=(d.data()||{}).days?.[TODAY]; if(!day) continue;
      if(d.id===UID){ if(day.done && !state.done){ state=fromRemote(day); try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} } continue; }
      OTHERS.push({id:d.id,s:+day.s||0,done:!!day.done});
      for(const [pid,c] of Object.entries(day.a||{})){CROWD[pid]=CROWD[pid]||{n:0,c:{}};CROWD[pid].n++;if(c)CROWD[pid].c[c]=(CROWD[pid].c[c]||0)+1}
    }
    render();
  }catch(e){ DB=null }
}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))])}
function fromRemote(day){
  return {date:TODAY,started:true,done:true,i:CARD.length,res:CARD.map(q=>{const c=(day.a||{})[q.id]||"";const a=parse(q).find(x=>x.name===c);const t=(day.t||{})[q.id]||(a?a.t:0);return {pid:q.id,ans:c,canon:c,tier:c?t:0,pts:c&&t?TIERS[t].p:0}})};
}
function queueRemote(){
  if(!DB||!UID||!state.started) return;
  const body={a:{},t:{},s:total(),done:state.done,at:Date.now()};
  for(const r of state.res){body.a[r.pid]=r.canon||"";body.t[r.pid]=r.tier||0}
  remoteBusy=remoteBusy.then(async()=>{
    try{const ref=DB.doc("plays/"+UID);const cur=await ref.get();const days={...((cur.exists&&cur.data().days)||{})};days[TODAY]=body;await ref.set({days})}catch(e){}
  });
}
function crowdTier(q,a){
  const cr=CROWD[q.id]; const n=cr?cr.n:0;
  if(n<30) return {tier:a.t,share:null,n};
  const share=(cr.c[a.name]||0)/n;
  const ct=share>=.20?1:share>=.08?2:share>=.03?3:share>=.01?4:5;
  return {tier:n<150?Math.round((a.t+ct)/2):ct,share,n};
}

/* ===================== VIEWS ===================== */
let timerInt=null;
function render(){
  clearInterval(timerInt);
  const app=$("#app");
  const head="";
  if(state.done) return app.innerHTML=head+resultsView(), wireResults();
  if(!state.started) return app.innerHTML=head+homeView(), wireHome();
  if(state.reveal) return app.innerHTML=head+revealView(), wireReveal();
  app.innerHTML=head+roundView(); wireRound();
}
function ladderHTML(){return `<div class="ladder">${[1,2,3,4,5].map(t=>`<div class="rung"><div class="bar" style="width:${18+t*14}%;background:${TIERS[t].c}"></div>${TIERS[t].n}<span class="pts">${TIERS[t].p} pts</span></div>`).join("")}</div>`}
function homeView(){
  return `<h1>Journeyman <em>Combat Trivia</em></h1>
  <p class="lede"><b>Journeyman</b> is a daily UFC and boxing trivia card. Every prompt has dozens of right answers, and the rarer yours is, the more it's worth.</p>
  <div class="rules"><div class="rule"><b>7</b><span>Rounds</span></div><div class="rule"><b>${ROUND_SECS}s</b><span>Per round</span></div><div class="rule"><b>1</b><span>Card a day</span></div></div>
  <div class="card"><div class="label">Scorecard</div>${ladderHTML()}</div>
  <div class="spacer"></div>
  <button class="btn" id="start">Touch gloves</button>
  <p class="foot">Same card for everyone, new card at midnight Eastern. Misses don't end the round, so keep throwing until the bell. Men's and women's, UFC and boxing, from the Jack Johnson era to last month.</p>`;
}
function wireHome(){$("#start").onclick=()=>{state.started=true;state.i=0;state.res=[];state.roundStart=Date.now();save();render()}}
function pipsHTML(){return `<div class="pips">${CARD.map((q,i)=>{const r=state.res[i];return `<div class="pip" style="background:${r?(r.tier?TIERS[r.tier].c:"#3a3540"):(i===state.i?"var(--bone)":"")}"></div>`}).join("")}</div>`}
function roundView(){
  const q=CARD[state.i];
  return `${pipsHTML()}<div class="rhead"><div class="rnum">Round ${state.i+1}<span> / 7</span></div>
  <div class="chips"><span class="chip">${esc(q.label)}</span><span class="chip ${q.d==="H"?"h":""}">${q.d==="H"?"Hard":"Medium"}</span></div></div>
  <div class="timer"><i id="tbar"></i></div><div class="secs" id="secs">${ROUND_SECS}</div>
  <div class="prompt">${esc(q.q)}</div>
  <form class="inrow" id="f" autocomplete="off"><input class="ans" id="ans" placeholder="Type a name…" autocapitalize="words" spellcheck="false" enterkeyhint="go"><button class="btn go">Throw</button></form>
  <div class="msg" id="msg"></div>`;
}
function wireRound(){
  const q=CARD[state.i]; const input=$("#ans"); input.focus();
  if(!state.roundStart){state.roundStart=Date.now();save()}
  const tick=()=>{const left=ROUND_SECS-(Date.now()-state.roundStart)/1000;
    if(left<=0){clearInterval(timerInt);return finishRound(null)}
    $("#tbar").style.transform=`scaleX(${left/ROUND_SECS})`;const s=$("#secs");s.textContent=Math.ceil(left);s.classList.toggle("low",left<6)};
  tick(); timerInt=setInterval(tick,100);
  $("#f").onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(!v)return;
    const m=match(q,v);
    if(m.type==="ok"){clearInterval(timerInt);return finishRound(m.a,v,!m.exact)}
    const msg=$("#msg");msg.textContent=m.type==="amb"?"More than one fighter fits. Add a first name.":`"${v}" isn't on the card. Keep swinging.`;
    input.value="";input.classList.remove("shake");void input.offsetWidth;input.classList.add("shake")};
}
function finishRound(a,typed,fixed){
  const q=CARD[state.i];
  if(a){const c=crowdTier(q,a);state.res[state.i]={pid:q.id,ans:a.name,canon:a.name,typed:fixed?typed:"",tier:c.tier,pts:TIERS[c.tier].p,share:c.share}}
  else state.res[state.i]={pid:q.id,ans:"",canon:"",tier:0,pts:0};
  state.reveal=true; state.roundStart=null; save(); render();
}
function revealView(){
  const q=CARD[state.i], r=state.res[state.i];
  const rr=rng(DAY*31+state.i);
  const deep=parse(q).filter(a=>a.t>=3&&a.name!==r.canon).map(a=>[a,rr()]).sort((x,y)=>y[0].t-x[0].t||x[1]-y[1]).map(x=>x[0]);
  const t=r.tier?TIERS[r.tier]:null;
  const top=`${pipsHTML()}<div class="said"><div class="label">Your answer</div><div class="ans">${esc(r.ans||"—")}</div>${r.typed?`<div class="fix">You typed “${esc(r.typed)}” · corrected to <b>${esc(r.ans)}</b></div>`:""}</div>`;
  const meter=t?`<div class="meter" id="meter"><div class="mhead"><span>Impact meter</span><span id="mstat">Landing…</span></div>
    <div class="track" id="track">${[1,2,3,4,5].map(i=>`<div class="band" data-t="${i}" style="--c:${TIERS[i].c}"><span>${TIERS[i].n}</span><em>${TIERS[i].p}</em></div>`).join("")}
    <div class="trail" id="trail"></div><div class="glove" id="glove">🥊</div></div></div>`
    :`<div class="verdict"><div class="tier" style="color:var(--red)">The bell rang</div><div class="pts">+0 pts</div></div>`;
  const result=t?`<div class="verdict" style="border-color:${t.c}"><div class="tier" style="color:${t.c}">${t.n}</div><div class="pts">+${t.p} pts</div>
      ${r.share!=null?`<div class="crowd">${Math.round(r.share*100)}% of today's fighters said this</div>`:""}</div><div class="spacer"></div>`:"";
  return `${top}${meter}<div class="after ${t?"":"on"}" id="after">${result}
  <div class="deep"><div class="label">Deep cuts on the card</div><ul>${deep.slice(0,3).map(a=>`<li>${esc(a.name)}<span style="color:${TIERS[a.t].c}">${TIERS[a.t].n}</span></li>`).join("")}</ul></div>
  <div class="spacer"></div><button class="btn" id="nx">${state.i===CARD.length-1?"Go to the scorecards":"Next round"}</button></div>`;
}
function dropMeter(r,done){
  const track=$("#track"),glove=$("#glove"),trail=$("#trail"),bands=[...track.querySelectorAll(".band")];
  const jitter=(rng(DAY*101+state.i)()-.5)*9;
  const target=Math.min(97,Math.max(3,(r.tier-1)*20+10+jitter));  // % from top
  const dur=1600+r.tier*320, t0=performance.now();
  const ease=x=>{const e=1-Math.pow(1-x,4);return Math.min(1,e+0.018*Math.sin(x*Math.PI*7)*(1-x))};
  const step=now=>{const x=Math.min(1,(now-t0)/dur), y=target*ease(x);
    glove.style.top=y+"%"; trail.style.height=y+"%";
    const cur=Math.min(5,Math.floor(y/20)+1); bands.forEach(b=>b.classList.toggle("lit",+b.dataset.t<=cur));
    if(x<1) return requestAnimationFrame(step);
    bands.forEach(b=>b.classList.toggle("hit",+b.dataset.t===r.tier));
    track.classList.add("thud"); const st=$("#mstat"); st.textContent=TIERS[r.tier].n; st.style.color=TIERS[r.tier].c;
    setTimeout(done,350)};
  requestAnimationFrame(step);
}
function wireReveal(){
  const r=state.res[state.i];
  const show=()=>{const a=$("#after");if(!a)return;a.classList.add("on");$("#nx").focus()};
  if(r.tier) dropMeter(r,show); else show();
  const b=$("#nx");b.onclick=()=>{state.reveal=false;state.i++;if(state.i>=CARD.length)state.done=true;else state.roundStart=Date.now();save();render()}}
function shareText(){return `JOURNEYMAN #${DAY+1} 🥊 ${total()}/700\n${state.res.map(r=>r.tier?TIERS[r.tier].e:"⬛").join("")}\n${rankFor(total())}`}
function resultsView(){
  const s=total();
  const board=DB?boardHTML(s):"";
  return `<div class="score"><div class="label">Final scorecard</div><div class="big">${s}<small>/700</small></div><div class="rank">${rankFor(s)}</div></div>
  <div class="cardline">${CARD.map((q,i)=>{const r=state.res[i]||{};const t=r.tier?TIERS[r.tier]:null;return `<div class="bout" style="border-left-color:${t?t.c:"#3a3540"}"><div class="n">${i+1}</div><div><div class="q">${esc(q.q)}</div><div class="a">${r.ans?esc(r.ans):"—"}</div></div><div class="t" style="color:${t?t.c:"var(--muted)"}"><b>${r.pts||0}</b>${t?t.n:"No answer"}</div></div>`}).join("")}</div>
  <div class="row2"><button class="btn" id="share">Copy result</button><button class="btn ghost" id="how">How scoring works</button></div>
  ${board}
  <div class="next">Next card in<b id="cd">--:--:--</b></div>`;
}
function boardHTML(mine){
  const rows=OTHERS.filter(o=>o.done).concat([{id:UID,s:mine,done:true,me:true}]).sort((a,b)=>b.s-a.s).slice(0,10);
  return `<div class="board"><div class="label">Today's leaderboard</div><ol id="board">${rows.map((r,i)=>`<li class="${r.me?"me":""}" data-id="${esc(r.id)}"><span>${i+1}. <span class="nm">${r.me?"You":"Fighter"}</span></span><span>${r.s}</span></li>`).join("")}</ol></div>`;
}
async function nameBoard(){
  if(!USER||!USER.profiles) return;
  try{const ids=[...document.querySelectorAll("#board li:not(.me)")].map(l=>l.dataset.id);if(!ids.length)return;
    const ps=await USER.profiles(ids);document.querySelectorAll("#board li:not(.me)").forEach(l=>{const p=ps&&ps[l.dataset.id];l.querySelector(".nm").textContent=(p&&p.name)||"Fighter"})}catch(e){}
}
function wireResults(){
  $("#share").onclick=async()=>{try{await navigator.clipboard.writeText(shareText());toast("Copied. Go talk your trash.")}catch(e){toast("Couldn't copy here")}};
  $("#how").onclick=()=>{const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h3>How scoring works</h3><p>Every prompt has a long list of correct answers, and each one sits in a tier. The obvious names are Casual. The ones only a real student of the sport remembers are Unanimous Champ.</p>${ladderHTML()}<div class="spacer"></div><p>Early on, tiers are set by hand. Once enough people play a card, the tiers follow what players actually answered: say something only 1 in 100 people said and you're near the top.</p><button class="btn ghost" id="cl">Close</button></div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.id==="cl")m.remove()}};
  const cd=()=>{const s=secsToMidnightET();const el=$("#cd");if(el)el.textContent=[s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,"0")).join(":")};
  cd(); timerInt=setInterval(cd,1000); nameBoard();
}

/* resume a round in progress: a reload mid-round doesn't reset the clock */
render();
initShared();
</script>
</body>
</html>
